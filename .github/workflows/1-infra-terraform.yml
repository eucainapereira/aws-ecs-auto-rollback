name: "1 - Infraestrutura AWS (Terraform Apply / Destroy)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform a executar na AWS"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: "us-east-2"
  TF_WORKING_DIR: "./terraform"

jobs:
  terraform:
    name: "Terraform (${{ inputs.action }})"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "2. Autenticação AWS via GitHub Secrets"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "3. Mascarar Account ID nos Logs"
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"

      - name: "4. Restaurar Estado Anterior do Terraform (Artifact)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN_ID=$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "1-infra-terraform.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)

          if [ -n "${LAST_RUN_ID}" ]; then
            echo "Restaurando terraform.tfstate da última execução bem-sucedida (Run ID: ${LAST_RUN_ID})..."
            gh run download "${LAST_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "terraform-state" \
              --dir "${TF_WORKING_DIR}" || echo "Nenhum artifact terraform-state encontrado na execução anterior."
          else
            echo "Nenhuma execução prévia bem-sucedida encontrada. Iniciando estado limpo."
          fi

      - name: "5. Setup do Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: "6. Terraform Init & Validate"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform validate

      - name: "7. Executar Terraform Apply"
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="github_repo=${GITHUB_REPOSITORY}" \
            -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: "8. Executar Terraform Destroy (Limpeza de Custos)"
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="github_repo=${GITHUB_REPOSITORY}"

      - name: "9. Salvar Estado Atualizado do Terraform (Artifact)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 90

      - name: "10. Publicar Resumo da Infraestrutura no GitHub Summary"
        if: ${{ inputs.action == 'apply' && success() }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"

          ALB_URL=$(terraform output -raw alb_url)
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          DDB_TABLE=$(terraform output -raw dynamodb_table_name)

          {
            echo "## 🏗️ Infraestrutura AWS Provisionada com Sucesso!"
            echo ""
            echo "| Recurso | Valor |"
            echo "| :--- | :--- |"
            echo "| **URL Pública do Portal (ALB)** | \`${ALB_URL}\` |"
            echo "| **Cluster ECS** | \`${CLUSTER}\` |"
            echo "| **Serviço ECS** | \`${SERVICE}\` |"
            echo "| **Tabela DynamoDB** | \`${DDB_TABLE}\` |"
            echo "| **Repositório ECR** | \`clientes-app\` |"
            echo ""
            echo "> 💡 **Próximo passo:** Execute o workflow **2 - Deploy App & Auto-Rollback Monitor** para publicar a \`v1.0\` (estável) ou simular a falha na \`v2.0\`."
          } >> "$GITHUB_STEP_SUMMARY"
